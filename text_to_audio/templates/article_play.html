{% extends "base.html" %}

{% block title %}Play Audio{% endblock %}

{% block content %}
<div class="container">
    <h1>{{ article.title }}</h1>
    <audio controls class="w-100 mt-3">
        <source src="{{ audio_url }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <div class="mt-3">
        <a href="{{ audio_url }}" class="btn btn-primary">
            <i class="bi bi-download"></i> Download MP3
        </a>
        <a href="{% url 'feed-articles' feed_id=article.feed.id %}" class="btn btn-secondary">Back to Articles</a>
    </div>
</div>
{% endblock %}
