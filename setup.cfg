[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .git,__pycache__,docs/conf.py,old,build,dist,.venv
max-complexity = 20
per-file-ignores =
    text_to_audio/tasks.py:C901,E501
    */migrations/*:E501,F401,E203,E266,E731,W503,D100,D101,D102,D103,D104,D105,D106,D107

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
strict_optional = True

[mypy.plugins.django-stubs]
django_settings_module = "rss_tts.settings"

[mypy-*.migrations.*]
ignore_errors = True
