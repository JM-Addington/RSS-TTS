[flake8]
max-line-length = 88
extend-ignore = E203
exclude = .git,__pycache__,docs/conf.py,old,build,dist,.venv
max-complexity = 20
per-file-ignores =
    text_to_audio/tasks.py:C901
    text_to_audio/services/content_analysis.py:E501
    */migrations/*:E501,F401,E203,E266,E731,W503,D100,D101,D102,D103,D104,D105,D106,D107
    tests/*:D100,D101,D102

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
strict_optional = True

[mypy.plugins.django-stubs]
django_settings_module = "rss_tts.settings"

[mypy-*.migrations.*]
ignore_errors = True

[mypy.rss_tts.*]
disallow_untyped_defs = False

[mypy.rss_tts.celery]
ignore_errors = True

[mypy.celery.*]
ignore_missing_imports = True

[mypy.pydub.*]
ignore_missing_imports = True

[mypy.tests.*]
disallow_untyped_defs = False
disable_error_code = attr-defined

[mypy.text_to_audio.tasks]
disable_error_code = attr-defined

[mypy.text_to_audio.views]
disable_error_code = attr-defined
