[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-tts"
version = "1.0.0"
description = "RSS to TTS conversion service using Django and OpenAI"
authors = [{name = "RSS-TTS Team"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
]

[project.urls]
Repository = "https://github.com/yourusername/rss-tts"
Documentation = "https://github.com/yourusername/rss-tts/blob/main/README.md"

# Tool configurations
[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude common directories
  \.git
  | \.mypy_cache
  | \.venv
  | venv
  | \.env
  | env
  | __pycache__
  | node_modules
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "*/migrations/*",
    "*/node_modules/*",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
]
known_django = "django"
known_first_party = ["rss_tts", "text_to_audio"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]


[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
plugins = ["mypy_django_plugin.main"]
exclude = [
    "migrations/",
    "node_modules/",
    "build/",
    "dist/",
    ".venv/",
    "venv/",
]

[tool.django-stubs]
django_settings_module = "rss_tts.settings"

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "rss_tts.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "rss_tts.celery"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "pydub.*",
    "audioop.*",
    "pyaudioop.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "text_to_audio.tasks"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "text_to_audio.views"
disable_error_code = ["attr-defined", "assignment", "arg-type"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rss_tts.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--disable-warnings",
    "--tb=short",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["text_to_audio", "rss_tts"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/node_modules/*",
    "manage.py",
    "*/settings/*",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\(Protocol\\):",
    "@(abc\\.)?abstractmethod",
]
