services:
  # Caddy web server for serving static files and reverse proxy
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./media:/media  # Bind mount for serving MP3 files
      - caddy-data:/data  # Caddy's data directory for certificates
      - caddy-config:/config  # Caddy's config directory
      # For Docker volume instead of bind mount for media, uncomment:
      # - media-data:/media
    depends_on:
      - web
    networks:
      - rsstts
      - caddy

  web:
    build: .
    command: /app/start-web.sh gunicorn rss_tts.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    # Port mapping removed - now accessed through Caddy
    volumes:
      - ./data/sqlite-data:/app/data
      - ./media:/app/media  # Bind mount for saving MP3 files
      # For Docker volume instead of bind mount, uncomment:
      # - media-data:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - redis
      - worker
    networks:
      - rsstts

  worker:
    build: .
    command: /app/start-web.sh celery -A rss_tts worker --loglevel=info
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - ./data/sqlite-data:/app/data
      - ./media:/app/media  # Bind mount for saving MP3 files
      # For Docker volume instead of bind mount, uncomment:
      # - media-data:/app/media
    healthcheck:
      test: ["CMD", "celery", "-A", "rss_tts", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - redis
    networks:
      - rsstts

  redis:
    image: redis:7
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - ./data/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rsstts

volumes:
  caddy-data:
  caddy-config:
  # Uncomment to use Docker volume instead of bind mount for media files:
  # media-data:

networks:
  rsstts:
  caddy:
    external: true
