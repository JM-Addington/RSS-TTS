version: "3.9"

services:
  web:
    build: .
    command: gunicorn rss_tts.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: celery -A rss_tts worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - db

  redis:
    image: redis:7

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rss_tts
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
