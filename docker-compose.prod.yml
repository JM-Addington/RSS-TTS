version: "3.9"

services:
  web:
    build: .
    command: gunicorn rss_tts.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/app/data

  worker:
    build: .
    command: celery -A rss_tts worker --loglevel=info
    env_file: .env
    depends_on:
      - redis
    volumes:
      - sqlite-data:/app/data

  redis:
    image: redis:7

volumes:
  sqlite-data: