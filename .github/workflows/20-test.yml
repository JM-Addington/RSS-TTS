name: 20 - Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run workflow on'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - dev/main
  pull_request:
  issue_comment:
    types: [created]

jobs:
  check_comment:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/test')
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - id: check
        run: |
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

  test:
    runs-on: ubuntu-latest
    needs: ${{ github.event_name == 'issue_comment' && fromJSON('["check_comment"]') || fromJSON('[]') }}
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/test'))

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # No longer need to install Redis as we're using memory backend for Celery

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Setup SQLite directories
        run: |
          mkdir -p ./data
          chmod 777 ./data

      - name: Run tests
        run: python -m pytest tests -v
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-key-not-for-production"
          SQLITE_DATA_DIR: "./data"
          CELERY_BROKER_URL: "memory://"
          CELERY_TASK_ALWAYS_EAGER: "True"
          PYTHONPATH: "."
