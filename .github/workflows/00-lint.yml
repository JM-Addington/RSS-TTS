name: 00 - Lint and Format

on:
  push:
    branches:
      - main
      - dev/main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install autopep8 black flake8 isort
      
      # First run formatters with auto-fix
      - name: Run formatters
        run: |
          autopep8 --in-place --recursive .
          black .
          isort .
      
      # Check if changes were made
      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          echo "modified=$(if git status --porcelain | grep .; then echo true; else echo false; fi)" >> "$GITHUB_OUTPUT"
      
      # Commit changes if any were made
      - name: Commit formatting changes
        if: steps.git-check.outputs.modified == 'true' && github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: Auto-format code with autopep8, black, and isort [skip ci]"
          git push
      
      # Now run linters (to check but not auto-fix)
      - name: Run linters
        if: success() || failure()  # Run even if formatting failed
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=88 --statistics