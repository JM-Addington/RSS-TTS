name: 00 - Lint and Format

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run workflow on'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - dev/main
  pull_request:
  issue_comment:
    types: [created]

jobs:
  check_comment:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/test')
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - id: check
        run: |
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

  lint:
    runs-on: ubuntu-latest
    needs: [check_comment]
    if: github.event_name != 'issue_comment' || needs.check_comment.outputs.should_run == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || (github.event_name == 'pull_request' && github.head_ref) || (github.event_name == 'issue_comment' && format('refs/pull/{0}/head', needs.check_comment.outputs.pr_number)) || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install autopep8 black flake8 isort

      # First run formatters with auto-fix
      - name: Run formatters
        run: |
          autopep8 --in-place --recursive .
          black .
          isort .

      # Check if changes were made
      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if git status --porcelain | grep .; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

      # Commit changes if any were made
      - name: Commit formatting changes
        if: steps.git-check.outputs.modified == 'true' && github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: Auto-format code with autopep8, black, and isort [skip ci]"
          git push

      # Now run linters (to check but not auto-fix)
      - name: Run linters
        if: success() || failure()  # Run even if formatting failed
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --max-complexity=10 --max-line-length=88 --statistics
