name: 00 - Lint and Format

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run workflow on'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - dev/main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Debug Workflow
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Action: ${{ github.action }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repo: ${{ github.repository }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.event.inputs.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      # First run formatters with auto-fix
      - name: Run formatters
        run: |
          black .
          isort .

      # Check if changes were made
      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if git status --porcelain | grep .; then
            echo "modified=true" >> "$GITHUB_OUTPUT"
          else
            echo "modified=false" >> "$GITHUB_OUTPUT"
          fi

      # Commit changes if any were made
      - name: Commit formatting changes
        if: steps.git-check.outputs.modified == 'true' && github.event_name == 'pull_request'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "style: Auto-format code with black and isort [skip ci]"
          git push

      # Now run linters (to check but not auto-fix)
      - name: Run linters
        if: success() || failure()  # Run even if formatting failed
        run: |
          flake8 . --count --statistics
