name: '99 - Request Qodo PR Review'

on:
  workflow_run:
    workflows: ['00 - Lint and Format', '10 - Type Check', '20 - Test']
    types:
      - completed
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
  issue_comment:
jobs:
  pr_agent_job:
    if: ${{ (github.event.sender.type != 'Bot' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run') && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run pr agent on every pull request, respond to user comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}