name: 90 - PR Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  check_comment:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ] \
             && jq -e '.issue.pull_request' "$GITHUB_EVENT_PATH" > /dev/null \
             && grep -q '/test' <<< "$(jq -r '.comment.body' "$GITHUB_EVENT_PATH")"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  pr_agent_job:
    # Only run after other workflows have completed
    if: (github.event.sender.type != 'Bot' || github.event_name == 'workflow_dispatch' || (github.event_name == 'issue_comment' && needs.check_comment.outputs.should_run == 'true')) && (!github.event.pull_request.draft || github.event_name == 'issue_comment')
    needs: [check_comment]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR review analysis
    steps:
      - name: PR Agent action step
        id: pragent
        uses: qodo-ai/pr-agent@v0.28
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
