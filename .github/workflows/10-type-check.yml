name: 10 - Type Check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run workflow on'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - dev/main
  pull_request:

jobs:
  type-check:
    runs-on: self-hosted
    if: |
      (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Debug Workflow
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Action: ${{ github.action }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repo: ${{ github.repository }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Setup SQLite directories
        run: |
          mkdir -p ./data
          chmod 777 ./data

      - name: Run mypy type checking
        run: |
          mypy .
        env:
          DJANGO_DEBUG: "True"
          DJANGO_SECRET_KEY: "ci-test-key-not-for-production"
          SQLITE_DATA_DIR: "./data"
          CELERY_BROKER_URL: "memory://"
          CELERY_TASK_ALWAYS_EAGER: "True"
          PYTHONPATH: "."
          CI: "True"
