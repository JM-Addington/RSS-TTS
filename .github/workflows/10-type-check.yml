name: 10 - Type Check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run workflow on'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
      - dev/main
  pull_request:
  issue_comment:
    types: [created]

jobs:
  check_comment:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/test')
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - id: check
        run: |
          echo "should_run=true" >> $GITHUB_OUTPUT
          echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

  type-check:
    runs-on: ubuntu-latest
    needs: [check_comment]
    if: github.event_name != 'issue_comment' || needs.check_comment.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || (github.event_name == 'pull_request' && github.head_ref) || (github.event_name == 'issue_comment' && format('refs/pull/{0}/head', needs.check_comment.outputs.pr_number)) || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install mypy

      - name: Run mypy type checking
        run: |
          mypy .
