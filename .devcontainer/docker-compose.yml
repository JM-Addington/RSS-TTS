version: "3.9"

services:
  # Development container
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/app
      - sqlite-data:/app/data
      - ./media:/app/media
    environment:
      DJANGO_SECRET_KEY: codespace-dev-secret-key
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
      SITE_URL: ${CODESPACE_NAME:+https://${CODESPACE_NAME}-8084.app.github.dev}
    command: sleep infinity
    # Overrides default command so container doesn't exit
    ports:
      - 8000:8000
    depends_on:
      - redis
    networks:
      - rsstts

  # Caddy web server for serving static files and reverse proxy
  caddy:
    image: caddy:2-alpine
    ports:
      - "8084:80"
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile
      - ../media:/media
    depends_on:
      - app
    networks:
      - rsstts

  # Redis service
  redis:
    image: redis:7
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ../redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rsstts

volumes:
  sqlite-data:
  redis-data:

networks:
  rsstts:
