version: "3.9"

# Environment variables applied to all services
x-environment: &default-environment
  DJANGO_SECRET_KEY: codespace-dev-secret-key
  DJANGO_DEBUG: "True"
  CELERY_BROKER_URL: redis://redis:6379/0
  PYTHONPATH: /workspaces/RSS-TTS

services:
  # Development container
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/RSS-TTS
      - sqlite-data:/workspaces/RSS-TTS/data
      - ../media:/workspaces/RSS-TTS/media
    environment:
      <<: *default-environment
      SITE_URL: ${CODESPACE_NAME:+https://${CODESPACE_NAME}-9084.app.github.dev}
    entrypoint: ["/workspaces/RSS-TTS/.devcontainer/entrypoint.sh"]
    command: ["bash", "-c", "cd /workspaces/RSS-TTS && exec bash"]
    working_dir: /workspaces/RSS-TTS
    ports:
      - 9000:9000
    depends_on:
      - redis
    networks:
      - rsstts

  # Worker for Celery tasks
  worker:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/RSS-TTS
      - sqlite-data:/workspaces/RSS-TTS/data
      - ../media:/workspaces/RSS-TTS/media
    environment:
      <<: *default-environment
      PATH: /usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: sh -c "cd /workspaces/RSS-TTS && /workspaces/RSS-TTS/start-worker.sh celery -A rss_tts worker --loglevel=info"
    working_dir: /workspaces/RSS-TTS
    depends_on:
      - redis
    networks:
      - rsstts

  # Caddy web server for serving static files and reverse proxy
  caddy:
    image: caddy:2-alpine
    ports:
      - "9084:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ../media:/media
    depends_on:
      - app
    networks:
      - rsstts

  # Redis service
  redis:
    image: redis:7
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ../redis.conf:/usr/local/etc/redis/redis.conf
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rsstts

volumes:
  sqlite-data:
  redis-data:

networks:
  rsstts:
