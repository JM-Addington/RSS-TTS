version: "3.9"

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - sqlite-data:/app/data
    ports:
      - "8084:8000"
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
      - worker

  worker:
    build: .
    command: celery -A rss_tts worker --loglevel=info
    volumes:
      - .:/app
      - sqlite-data:/app/data
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  sqlite-data:
  redis-data:
