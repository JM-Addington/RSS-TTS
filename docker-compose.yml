version: "3.9"

services:
  web:
    build: .
    command: /app/start-web.sh python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - sqlite-data:/app/data
    ports:
      - "8084:8000"
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://worker:6379/0
    depends_on:
      - worker

  worker:
    build: .
    command: >
      bash -c "redis-server /app/redis.conf &
      sleep 1 &&
      celery -A rss_tts worker --loglevel=info"
    volumes:
      - .:/app
      - sqlite-data:/app/data
      - redis-data:/data/redis
    ports:
      - "6379:6379"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://localhost:6379/0
    env_file:
      - .env

volumes:
  sqlite-data:
  redis-data:
