version: "3.9"

services:
  web:
    build: .
    command: /app/start-web.sh python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - sqlite-data:/app/data
    ports:
      - "8084:8000"
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - worker
      - redis

  worker:
    build: .
    command: celery -A rss_tts worker --loglevel=info
    volumes:
      - .:/app
      - sqlite-data:/app/data
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis

  redis:
    image: redis:7
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - .:/app
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  sqlite-data:
  redis-data:
