services:
  # Caddy web server for serving static files and reverse proxy
  caddy:
    image: caddy:2-alpine
    ports:
      - "8084:80"  # Changed from 8084:8000 to serve through Caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./media:/media  # Bind mount for serving MP3 files
      # For Docker volume instead of bind mount, uncomment the following:
      # - media-data:/media
    depends_on:
      - web
    networks:
      - rsstts

  web:
    build: .
    command: /app/start-web.sh python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ../data/sqlite-data/:/data
      - ./media:/app/media  # Bind mount for saving MP3 files
      # For Docker volume instead of bind mount, uncomment the following:
      # - media-data:/app/media
    # Port mapping removed - now accessed through Caddy
    env_file:
      - .env
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
      SQLITE_DATA_DIR: /data/db.sqlite3
    depends_on:
      - worker
      - redis
    networks:
      - rsstts

  worker:
    build: .
    command: celery -A rss_tts worker --loglevel=info
    volumes:
      - .:/app
      - ../data/sqlite-data/:/data
      - ./media:/app/media  # Bind mount for saving MP3 files
      # For Docker volume instead of bind mount, uncomment the following:
      # - media-data:/app/media
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: "True"
      CELERY_BROKER_URL: redis://redis:6379/0
      SQLITE_DATA_DIR: /data/db.sqlite3
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - rsstts

  redis:
    image: redis:7
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - .:/app
      - ../data/redis:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rsstts

networks:
  rsstts:
